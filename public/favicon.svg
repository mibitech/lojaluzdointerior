<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo circular azul escuro -->
  <circle cx="32" cy="32" r="32" fill="#1a2a4a"/>

  <!-- Compasso (direito) -->
  <g stroke="#d4af37" stroke-width="2.8" stroke-linecap="round" fill="none">
    <!-- Perna esquerda do compasso -->
    <line x1="32" y1="14" x2="20" y2="46"/>
    <!-- Perna direita do compasso -->
    <line x1="32" y1="14" x2="44" y2="46"/>
    <!-- Arco do compasso (dobradiça) -->
    <path d="M24 28 A10 10 0 0 0 40 28" stroke-width="2.2"/>
    <!-- Ponteiras do compasso -->
    <circle cx="20" cy="46" r="1.5" fill="#d4af37" stroke="none"/>
    <circle cx="44" cy="46" r="1.5" fill="#d4af37" stroke="none"/>
  </g>

  <!-- Esquadro -->
  <g stroke="#d4af37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Braço vertical do esquadro -->
    <line x1="22" y1="20" x2="22" y2="44"/>
    <!-- Braço horizontal do esquadro -->
    <line x1="22" y1="44" x2="42" y2="44"/>
  </g>

  <!-- Letra G central -->
  <text x="32" y="37" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#d4af37">G</text>
</svg>
